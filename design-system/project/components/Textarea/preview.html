<!-- @dsCard group="Формы" height=420 subtitle="Растёт по содержимому; моноширинное, ошибка, выключенное" -->
<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><style>
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans); }
  body { padding: 20px; }
  .line { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 14px; }
  .line:last-child { margin-bottom: 0; }
  .cap { font: 11px var(--font-mono); color: var(--text-dim); width: 84px; flex: none; }
  .grow { flex: 1; min-width: 0; }
  .frame { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
</style></head><body>
<div style="max-width:440px"><div class="line"><span class="cap">обычное</span><textarea class="bw-field bw-textarea grow" placeholder="Заметка к команде"></textarea></div><div class="line"><span class="cap">моно</span><textarea class="bw-field bw-textarea bw-field--mono grow">- keys: [e]
  shell: open ~</textarea></div><div class="line"><span class="cap">ошибка</span><textarea aria-invalid="true" class="bw-field bw-textarea bw-field--mono grow">- keys: [capslok]</textarea></div><div class="line"><span class="cap">выключено</span><textarea class="bw-field bw-textarea grow" disabled="">Недоступно</textarea></div></div>
</body></html>
