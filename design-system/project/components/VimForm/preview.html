<!-- @dsCard group="Формы" height=440 subtitle="Клавиши Vim в настройках: курсор-кольцо, буквенные метки, режимы COMMAND и INSERT, полоса подсказок, таблица клавиш" -->
<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><style>
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans); }
  body { padding: 20px; }
  .line { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 14px; }
  .line:last-child { margin-bottom: 0; }
  .cap { font: 11px var(--font-mono); color: var(--text-dim); width: 84px; flex: none; }
  .grow { flex: 1; min-width: 0; }
  .frame { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
</style></head><body>
<div class="line"><span class="cap">клавиши</span><button type="button" role="switch" aria-checked="false" aria-label="Клавиши Vim в форме" class="bw-switch"></button><span class="cap" style="width:auto">включите и ходите: j k, J K, h l, Enter, i, буквы меток, ?</span></div><div data-vim-form="true" class="frame" style="position:relative;display:flex;flex-direction:column;height:330px;max-width:640px;background:var(--surface-2)"><div style="display:flex;flex:1;min-height:0"><nav class="bw-nav" aria-label="Разделы" style="width:160px;flex:none;padding:8px;border-right:1px solid var(--border)"><button type="button" aria-current="page" class="bw-nav__item" data-vim-item="nav:general" data-vim-nowalk="true"><span class="bw-nav__icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"></path></svg></span><span class="bw-nav__label">Основные</span></button><button type="button" class="bw-nav__item" data-vim-item="nav:commands" data-vim-nowalk="true"><span class="bw-nav__icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 8 4 4-4 4"></path><path d="M12 16h7"></path></svg></span><span class="bw-nav__label">Команды</span></button></nav><div class="bw-scrollbars" style="position:relative;flex:1;min-width:0;overflow-y:auto;padding:16px;display:grid;gap:14px;align-content:start"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;font:13px/16px var(--font-sans);color:var(--text)">Запускать при входе<button type="button" role="switch" aria-checked="true" aria-label="Запускать при входе" class="bw-switch" data-vim-item="general:autostart"></button></div><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;font:13px/16px var(--font-sans);color:var(--text)">Тема<div role="radiogroup" aria-label="Тема" class="bw-seg bw-seg--sm" data-vim-item="general:theme"><button type="button" role="radio" aria-checked="true" class="bw-seg__opt">Тёмная</button><button type="button" role="radio" aria-checked="false" class="bw-seg__opt">Светлая</button><button type="button" role="radio" aria-checked="false" class="bw-seg__opt">Как в системе</button></div></div><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;font:13px/16px var(--font-sans);color:var(--text)">Поиск<button type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Поисковая система" class="bw-select" data-vim-item="general:engine" data-vim-kind="select"><span class="bw-select__value">DuckDuckGo</span><svg class="bw-select__chevron" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button></div><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;font:13px/16px var(--font-sans);color:var(--text)">Имя<span style="width:200px"><div class="bw-field bw-field--box bw-field--sm"><input class="bw-field__input" data-vim-item="general:name" aria-label="Имя" value="Runwa"/></div></span></div><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;font:13px/16px var(--font-sans);color:var(--text)">Прозрачность<span class="bw-slider" style="--sl-f:0.8"><span class="bw-slider__track"></span><span class="bw-slider__fill"></span><span class="bw-slider__knob"></span><span class="bw-slider__ring"></span><input type="range" min="0" max="100" step="1" aria-label="Прозрачность" data-vim-item="general:opacity" value="80"/></span></div><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;font:13px/16px var(--font-sans);color:var(--text)"><span></span><button type="button" class="bw-btn bw-btn--secondary" data-vim-item="general:reset">Вернуть по умолчанию</button></div></div></div><div class="bw-hintbar"><span>Клавиши выключены: форма как обычная, Tab ходит по элементам</span></div><div aria-hidden="true" class="bw-vimlabels"></div></div>
</body></html>
