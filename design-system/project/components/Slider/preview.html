<!-- @dsCard group="Формы" height=290 subtitle="Бегунок-пластина; прогресс со штриховкой: доля, ошибка, размер неизвестен" -->
<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><style>
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans); }
  body { padding: 20px; }
  .line { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 14px; }
  .line:last-child { margin-bottom: 0; }
  .cap { font: 11px var(--font-mono); color: var(--text-dim); width: 84px; flex: none; }
  .grow { flex: 1; min-width: 0; }
  .frame { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
</style></head><body>
<div class="line"><span class="cap">обычный</span><span class="bw-slider" style="--sl-f:0.4"><span class="bw-slider__track"></span><span class="bw-slider__fill"></span><span class="bw-slider__knob"></span><span class="bw-slider__ring"></span><input type="range" min="0" max="100" step="1" aria-label="Яркость" value="40"/></span><span class="cap" style="width:auto">40%</span></div><div class="line"><span class="cap">с шагом</span><span class="bw-slider grow" style="--sl-f:0.625"><span class="bw-slider__track"></span><span class="bw-slider__fill"></span><span class="bw-slider__knob"></span><span class="bw-slider__ring"></span><input type="range" min="0" max="2" step="0.25" aria-label="Свечение" value="1.25"/></span><span class="cap" style="width:auto">1.25×</span></div><div class="line"><span class="cap">недоступен</span><span class="bw-slider" style="--sl-f:0.6"><span class="bw-slider__track"></span><span class="bw-slider__fill"></span><span class="bw-slider__knob"></span><span class="bw-slider__ring"></span><input type="range" min="0" max="100" step="1" aria-label="Недоступно" disabled="" value="60"/></span></div><div class="line"><span class="cap">прогресс</span><span role="progressbar" aria-label="Загрузка" aria-valuemin="0" aria-valuemax="100" aria-valuenow="40" class="bw-progress" style="--pg-f:0.4;width:220px"><span class="bw-progress__fill"></span></span><span role="progressbar" aria-label="Готово" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" data-full="" class="bw-progress" style="--pg-f:1;width:120px"><span class="bw-progress__fill"></span></span></div><div class="line"><span class="cap">ошибка</span><span role="progressbar" aria-label="Ошибка загрузки" aria-valuemin="0" aria-valuemax="100" aria-valuenow="65" class="bw-progress bw-progress--error" style="--pg-f:0.65;width:220px"><span class="bw-progress__fill"></span></span></div><div class="line"><span class="cap">неизвестно</span><span role="progressbar" aria-label="Подготовка" class="bw-progress bw-progress--busy" style="--pg-f:0;width:220px"><span class="bw-progress__fill"></span></span></div>
</body></html>
